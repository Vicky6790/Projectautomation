# Local Docker Compose. On-prem host settings live in docker-compose.onprem.yml.
services:
  api:
    build:
      context: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      AUTH_MODE: ${AUTH_MODE:-disabled}
      AUTH_BOOTSTRAP_USER: ${AUTH_BOOTSTRAP_USER:-admin}
      AUTH_BOOTSTRAP_PASSWORD: ${AUTH_BOOTSTRAP_PASSWORD:-}
      SESSION_IDLE_HOURS: ${SESSION_IDLE_HOURS:-8}
      DATA_DIR: /data
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      AI_STUB: ${AI_STUB:-true}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-52428800}
      WSR_GO_LIVE_MARKERS: ${WSR_GO_LIVE_MARKERS:-go-live,go live}
      WSR_UPCOMING_DAYS: ${WSR_UPCOMING_DAYS:-7}
      REQUEST_TTL_HOURS: ${REQUEST_TTL_HOURS:-24}
      CORS_ORIGINS: http://localhost:8080
    volumes:
      - api-storage:/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')",
        ]
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 40s

  client:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 10s

volumes:
  api-storage:
